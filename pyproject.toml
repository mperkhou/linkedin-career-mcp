[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "linkedin-career-mcp"
version = "0.1.5"
description = "Python-centric MCP server for LinkedIn public job search and future career workflows."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "mperkhou" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "linkedin",
  "jobs",
  "career",
  "python"
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "flask>=3.0,<4",
  "httpx>=0.27,<1",
  "mcp[cli]>=1.13,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.7,<3",
  "pypdf>=5.0,<7",
  "pyyaml>=6.0,<7",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1"
]
browser = [
  "playwright>=1.45,<2"
]

[project.scripts]
linkedin-career-mcp = "linkedin_career_mcp.__main__:main"
linkedin-career-match-jobs = "linkedin_career_mcp.workflows.matching:main"
linkedin-career-regenerate-resumes = "linkedin_career_mcp.workflows.matching:regenerate_main"
linkedin-career-regenerate-cover-letters = "linkedin_career_mcp.workflows.matching:regenerate_cover_letters_main"
linkedin-career-regenerate-all = "linkedin_career_mcp.workflows.matching:regenerate_all_main"
linkedin-career-refresh-static-artifacts = "linkedin_career_mcp.artifact_refresh:refresh_static_artifacts_main"
linkedin-career-audit-jods = "linkedin_career_mcp.jod_cleaner_audit:main"
linkedin-career-webapp = "linkedin_career_mcp.webapp:main"

[project.urls]
Homepage = "https://github.com/mperkhou/linkedin-career-mcp"
Repository = "https://github.com/mperkhou/linkedin-career-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_career_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
