professional_summary:
  header_text: Professional Summary
  paragraph: Analytical and metrics-driven Senior Platform Software Engineer with
    over 10 years of multi-disciplinary experience architecting scalable distributed
    systems, developer tooling, and cloud automation frameworks. Proven track record
    leading enterprise-level integrations, optimizing platform resilience, and implementing
    secure API and observability pipelines across 40,000+ devices. Combines a strong
    background in advanced mathematics and algorithmic problem-solving with hands-on
    expertise in CI/CD, Infrastructure as Code (IaC), and modern multi-tenant cloud
    architectures.
