<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Agentic LinkedIn career workflow</title>
  <desc id="desc">A visual workflow showing profile inputs, public LinkedIn search, LLM planning, artifact generation, SQLite tracking, and the local Flask application UI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.42" stop-color="#0c2035"/>
      <stop offset="1" stop-color="#071a18"/>
    </linearGradient>
    <radialGradient id="pulseA" cx="25%" cy="10%" r="70%">
      <stop offset="0" stop-color="#35f2cc" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#35f2cc" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#35f2cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pulseB" cx="86%" cy="18%" r="74%">
      <stop offset="0" stop-color="#8cc8ff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#8cc8ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8cc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40f2c8"/>
      <stop offset="1" stop-color="#7fb8ff"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61efd2"/>
    </marker>
    <style>
      .label { font: 700 15px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #eef8ff; }
      .small { font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b8c7d6; }
      .tiny { font: 650 10px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #8fa8ba; letter-spacing: 1px; text-transform: uppercase; }
      .metric { font: 800 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .title { font: 800 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #b8c7d6; }
      .card { fill: url(#card); stroke: #ffffff; stroke-opacity: 0.15; stroke-width: 1; filter: url(#shadow); }
      .cardHot { fill: #0f2b3a; stroke: #61efd2; stroke-opacity: 0.55; stroke-width: 1.2; filter: url(#shadow); }
      .line { fill: none; stroke: #61efd2; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .lineSoft { fill: none; stroke: #7fb8ff; stroke-opacity: 0.72; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .chip { fill: #ffffff; fill-opacity: 0.08; stroke: #ffffff; stroke-opacity: 0.13; }
      .accentText { fill: #68f0d4; }
      .orangeText { fill: #ffd166; }
    </style>
  </defs>

  <rect width="1280" height="820" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="820" rx="34" fill="url(#pulseA)"/>
  <rect width="1280" height="820" rx="34" fill="url(#pulseB)"/>
  <rect width="1280" height="820" rx="34" fill="url(#grid)"/>

  <text x="70" y="82" class="title">Agentic Career Workflow</text>
  <text x="70" y="112" class="subtitle">Public LinkedIn search, profile-aware LLM generation, local artifacts, and a human-owned application tracker.</text>

  <g transform="translate(70 126)">
    <rect class="chip" x="0" y="0" width="820" height="42" rx="18"/>
    <text x="20" y="16" class="tiny">Acronym key</text>
    <text x="20" y="32" class="small">CJD = current job description · SCJDiR = summarized current job description in resume · JOD = job opening description</text>
  </g>

  <g transform="translate(930 54)">
    <rect class="chip" x="0" y="0" width="214" height="44" rx="22"/>
    <circle cx="28" cy="22" r="8" fill="url(#hot)" filter="url(#glow)"/>
    <text x="46" y="26" class="small">No LinkedIn login required</text>
  </g>

  <g transform="translate(70 188)">
    <text x="0" y="0" class="tiny">Inputs</text>
    <rect class="card" x="0" y="18" width="250" height="128" rx="18"/>
    <text x="24" y="54" class="label">Private profile context</text>
    <text x="24" y="80" class="small">Resume plus CJD input</text>
    <text x="24" y="103" class="small">Check blacklists, SCJDiR,</text>
    <text x="24" y="126" class="small">and prior roles</text>

    <rect class="card" x="0" y="178" width="250" height="128" rx="18"/>
    <text x="24" y="214" class="label">Public job market</text>
    <text x="24" y="240" class="small">LinkedIn guest pages</text>
    <text x="24" y="263" class="small">Remote and hybrid filters</text>
    <text x="24" y="286" class="small">No credential scope</text>
  </g>

  <g transform="translate(410 188)">
    <text x="0" y="0" class="tiny">Intelligence layer</text>
    <rect class="cardHot" x="0" y="18" width="280" height="128" rx="18"/>
    <text x="24" y="54" class="label">Section-aware planner</text>
    <text x="24" y="80" class="small">Splits static vs dynamic text</text>
    <text x="24" y="103" class="small">Builds prompts per section</text>
    <text x="24" y="126" class="small">Uses CJD + SCJDiR + JOD</text>

    <rect class="card" x="0" y="178" width="280" height="128" rx="18"/>
    <text x="24" y="214" class="label">Search and quality guard</text>
    <text x="24" y="240" class="small">Profile-aware job queries</text>
    <text x="24" y="263" class="small">Blacklist and duplicate checks</text>
    <text x="24" y="286" class="small">Cleaned job opening prompts</text>
  </g>

  <g transform="translate(780 188)">
    <text x="0" y="0" class="tiny">Generation layer</text>
    <rect class="cardHot" x="0" y="18" width="310" height="128" rx="18"/>
    <text x="24" y="54" class="label">Resume section tailoring</text>
    <text x="24" y="80" class="small">Static: header, summary, education</text>
    <text x="24" y="103" class="small">Dynamic: SCJDiR, skills, prior roles</text>
    <text x="24" y="126" class="small">Custom fit from CJD + JOD</text>

    <rect class="cardHot" x="0" y="178" width="310" height="128" rx="18"/>
    <text x="24" y="214" class="label">Cover-letter section synthesis</text>
    <text x="24" y="240" class="small">Static: project paragraph, close</text>
    <text x="24" y="263" class="small">Dynamic: opening, Oracle, prior fit</text>
    <text x="24" y="286" class="small">Custom fit from CJD + SCJDiR + JOD</text>
  </g>

  <g transform="translate(260 555)">
    <text x="0" y="0" class="tiny">Local operations</text>
    <rect class="card" x="0" y="18" width="250" height="126" rx="18"/>
    <text x="24" y="54" class="label">Artifact store</text>
    <text x="24" y="80" class="small">output/resumes</text>
    <text x="24" y="103" class="small">output/cover_letters</text>
    <text x="24" y="126" class="small">Workbook compatibility</text>
  </g>

  <g transform="translate(590 555)">
    <rect class="card" x="0" y="18" width="250" height="126" rx="18"/>
    <text x="24" y="54" class="label">SQLite tracker database</text>
    <text x="24" y="80" class="small">Resume and cover PDFs</text>
    <text x="24" y="103" class="small">Parsed and prompt descriptions</text>
    <text x="24" y="126" class="small">Applied status and notes</text>
  </g>

  <g transform="translate(920 555)">
    <rect class="card" x="0" y="18" width="250" height="126" rx="18"/>
    <text x="24" y="54" class="label">Flask application UI</text>
    <text x="24" y="80" class="small">Resume and cover links</text>
    <text x="24" y="103" class="small">Chromium job launcher</text>
    <text x="24" y="126" class="small">Human-in-the-loop apply flow</text>
  </g>

  <g transform="translate(780 510)">
    <rect class="chip" x="0" y="0" width="310" height="42" rx="20"/>
    <text x="24" y="18" class="tiny">Shared output path</text>
    <text x="24" y="33" class="small">Render PDFs, write files, upsert tracker</text>
  </g>

  <path class="line" d="M 320 268 C 352 268 372 268 410 268"/>
  <path class="lineSoft" d="M 320 428 C 352 428 372 428 410 428"/>
  <path class="line" d="M 690 268 C 724 268 742 268 780 268"/>
  <path class="line" d="M 690 428 C 724 428 742 428 780 428"/>
  <path class="line" d="M 1090 286 C 1150 318 1150 492 1090 531"/>
  <path class="lineSoft" d="M 935 494 C 936 499 936 504 936 510"/>
  <path class="line" d="M 780 532 C 684 556 600 586 510 618"/>
  <path class="lineSoft" d="M 936 552 C 914 584 872 607 840 618"/>
  <path class="line" d="M 840 636 C 876 636 890 636 920 636"/>
  <path class="lineSoft" d="M 590 636 C 552 636 534 636 510 636"/>

  <g transform="translate(82 720)">
    <rect class="chip" x="0" y="0" width="236" height="46" rx="23"/>
    <text x="22" y="29" class="small"><tspan class="accentText">Result:</tspan> tailored PDFs per job</text>
  </g>
  <g transform="translate(344 720)">
    <rect class="chip" x="0" y="0" width="280" height="46" rx="23"/>
    <text x="22" y="29" class="small"><tspan class="accentText">Guardrail:</tspan> no automated submission</text>
  </g>
  <g transform="translate(650 720)">
    <rect class="chip" x="0" y="0" width="254" height="46" rx="23"/>
    <text x="22" y="29" class="small"><tspan class="orangeText">Signal:</tspan> practical AI automation</text>
  </g>
  <g transform="translate(930 720)">
    <rect class="chip" x="0" y="0" width="256" height="46" rx="23"/>
    <text x="22" y="29" class="small"><tspan class="accentText">Scale:</tspan> batch regeneration by ID</text>
  </g>
</svg>
