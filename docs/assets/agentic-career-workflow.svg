<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Agentic LinkedIn career workflow</title>
  <desc id="desc">End-to-end workflow showing private profile inputs, public LinkedIn discovery, section-aware resume and cover-letter generation, ATS evidence repair, artifact storage, SQLite tracking, Flask review, and human-owned application submission.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0b2034"/>
      <stop offset="1" stop-color="#071b19"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.055"/>
    </linearGradient>
    <linearGradient id="hotCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103348"/>
      <stop offset="1" stop-color="#0d2738"/>
    </linearGradient>
    <linearGradient id="repairCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#302412"/>
      <stop offset="1" stop-color="#132e2b"/>
    </linearGradient>
    <linearGradient id="storeCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132f26"/>
      <stop offset="1" stop-color="#102c3b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#61efd2"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 36px; font-weight: 800; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 500; fill: #b8c7d6; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 750; fill: #8fa8ba; letter-spacing: 1px; text-transform: uppercase; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; fill: #f2f8ff; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 560; fill: #bbcad7; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 560; fill: #a9bac8; }
      .metric { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 800; fill: #ffffff; }
      .accentText { fill: #68f0d4; }
      .blueText { fill: #38bdf8; }
      .goldText { fill: #fbbf24; }
      .card { fill: url(#card); stroke: #ffffff; stroke-opacity: 0.15; stroke-width: 1; filter: url(#shadow); }
      .hotCard { fill: url(#hotCard); stroke: #38bdf8; stroke-opacity: 0.44; stroke-width: 1.2; filter: url(#shadow); }
      .repairCard { fill: url(#repairCard); stroke: #fbbf24; stroke-opacity: 0.56; stroke-width: 1.2; filter: url(#shadow); }
      .storeCard { fill: url(#storeCard); stroke: #61efd2; stroke-opacity: 0.46; stroke-width: 1.2; filter: url(#shadow); }
      .chip { fill: #ffffff; fill-opacity: 0.08; stroke: #ffffff; stroke-opacity: 0.14; }
      .lane { fill: #ffffff; fill-opacity: 0.045; stroke: #ffffff; stroke-opacity: 0.12; stroke-width: 1; }
      .lineGreen { fill: none; stroke: #61efd2; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .lineBlue { fill: none; stroke: #38bdf8; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .lineGold { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .loop { fill: none; stroke: #fbbf24; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; marker-end: url(#arrowGold); }
    </style>
  </defs>

  <rect width="1280" height="920" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="920" rx="34" fill="url(#grid)"/>

  <text x="58" y="70" class="title">Agentic LinkedIn Career Workflow</text>
  <text x="58" y="100" class="subtitle">Public-job discovery, profile-aware generation, ATS evidence repair, local tracking, and human-owned application review.</text>

  <g transform="translate(910 46)">
    <rect class="chip" x="0" y="0" width="300" height="52" rx="24"/>
    <text x="20" y="20" class="tiny">Operating boundary</text>
    <text x="20" y="38" class="small">No LinkedIn login. No automated submit.</text>
  </g>

  <g transform="translate(58 126)">
    <rect class="chip" x="0" y="0" width="860" height="44" rx="18"/>
    <text x="20" y="17" class="tiny">Acronym key</text>
    <text x="20" y="33" class="small">CJD = current job description, SCJDiR = summarized current job description in resume, JOD = job opening description</text>
  </g>

  <g transform="translate(58 196)">
    <rect class="lane" x="0" y="0" width="274" height="606" rx="22"/>
    <text x="24" y="34" class="tiny">1. Private context</text>
    <text x="24" y="58" class="label">Profile inventory</text>

    <g transform="translate(22 86)">
      <rect class="card" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Expanded source resume</text>
      <text x="18" y="56" class="small">All factual skills, roles,</text>
      <text x="18" y="76" class="small">education, and evidence</text>
    </g>

    <g transform="translate(22 210)">
      <rect class="card" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Current role CJD</text>
      <text x="18" y="56" class="small">Abstract Oracle scope</text>
      <text x="18" y="76" class="small">for first-draft prompts</text>
    </g>

    <g transform="translate(22 334)">
      <rect class="card" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Workflow controls</text>
      <text x="18" y="56" class="small">Blacklist, model settings,</text>
      <text x="18" y="76" class="small">query history, run caps</text>
    </g>

    <g transform="translate(22 468)">
      <rect class="chip" x="0" y="0" width="230" height="88" rx="16"/>
      <text x="18" y="28" class="metric">source of truth</text>
      <text x="18" y="54" class="small">ATS repair can only use</text>
      <text x="18" y="72" class="small">evidence from this profile.</text>
    </g>
  </g>

  <g transform="translate(360 196)">
    <rect class="lane" x="0" y="0" width="274" height="606" rx="22"/>
    <text x="24" y="34" class="tiny">2. Public LinkedIn discovery</text>
    <text x="24" y="58" class="label">Find and qualify jobs</text>

    <g transform="translate(22 86)">
      <rect class="hotCard" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Planner model</text>
      <text x="18" y="56" class="small">Generates remote and</text>
      <text x="18" y="76" class="small">hybrid LinkedIn queries</text>
    </g>

    <g transform="translate(22 210)">
      <rect class="card" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Public job search</text>
      <text x="18" y="56" class="small">Guest pages only, with</text>
      <text x="18" y="76" class="small">dedupe and skip rules</text>
    </g>

    <g transform="translate(22 334)">
      <rect class="card" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Job detail scrape</text>
      <text x="18" y="56" class="small">Fetch title, company,</text>
      <text x="18" y="76" class="small">location, and public JOD</text>
    </g>

    <g transform="translate(22 468)">
      <rect class="chip" x="0" y="0" width="230" height="88" rx="16"/>
      <text x="18" y="28" class="metric">cleaned JOD</text>
      <text x="18" y="54" class="small">Company boilerplate is</text>
      <text x="18" y="72" class="small">reduced before prompting.</text>
    </g>
  </g>

  <g transform="translate(662 196)">
    <rect class="lane" x="0" y="0" width="274" height="606" rx="22"/>
    <text x="24" y="34" class="tiny">3. Generation and ATS</text>
    <text x="24" y="58" class="label">Create, score, repair</text>

    <g transform="translate(22 86)">
      <rect class="hotCard" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Initial prompts</text>
      <text x="18" y="56" class="small">Source resume + CJD</text>
      <text x="18" y="76" class="small">+ SCJDiR + JOD</text>
    </g>

    <g transform="translate(22 210)">
      <rect class="hotCard" x="0" y="0" width="230" height="96" rx="16"/>
      <text x="18" y="31" class="label">Render first PDFs</text>
      <text x="18" y="56" class="small">Resume and cover letter</text>
      <text x="18" y="76" class="small">from local templates</text>
    </g>

    <g transform="translate(22 334)">
      <rect class="repairCard" x="0" y="0" width="230" height="116" rx="16"/>
      <text x="18" y="31" class="label">ATS evidence repair</text>
      <text x="18" y="56" class="small">Score resume vs JOD, then</text>
      <text x="18" y="76" class="small">repair only source-backed</text>
      <text x="18" y="96" class="small">missing terms. Target 90+.</text>
    </g>

    <g transform="translate(22 488)">
      <rect class="chip" x="0" y="0" width="230" height="68" rx="16"/>
      <text x="18" y="28" class="metric">best factual draft</text>
      <text x="18" y="52" class="small">Keep only improved scores.</text>
    </g>
  </g>

  <g transform="translate(964 196)">
    <rect class="lane" x="0" y="0" width="258" height="606" rx="22"/>
    <text x="24" y="34" class="tiny">4. Local review loop</text>
    <text x="24" y="58" class="label">Track and apply</text>

    <g transform="translate(20 86)">
      <rect class="storeCard" x="0" y="0" width="218" height="96" rx="16"/>
      <text x="18" y="31" class="label">Artifact files</text>
      <text x="18" y="56" class="small">output/resumes and</text>
      <text x="18" y="76" class="small">output/cover_letters</text>
    </g>

    <g transform="translate(20 210)">
      <rect class="storeCard" x="0" y="0" width="218" height="96" rx="16"/>
      <text x="18" y="31" class="label">SQLite + workbook</text>
      <text x="18" y="56" class="small">PDF blobs, file links,</text>
      <text x="18" y="76" class="small">ATS score, status, notes</text>
    </g>

    <g transform="translate(20 334)">
      <rect class="storeCard" x="0" y="0" width="218" height="96" rx="16"/>
      <text x="18" y="31" class="label">Flask tracker UI</text>
      <text x="18" y="56" class="small">Search, filter, compare</text>
      <text x="18" y="76" class="small">JOD, download artifacts</text>
    </g>

    <g transform="translate(20 468)">
      <rect class="chip" x="0" y="0" width="218" height="88" rx="16"/>
      <text x="18" y="28" class="metric">human gate</text>
      <text x="18" y="54" class="small">Review, upload, submit,</text>
      <text x="18" y="72" class="small">and status are manual.</text>
    </g>
  </g>

  <path class="lineGreen" d="M 310 330 C 334 330 338 330 360 330"/>
  <path class="lineBlue" d="M 310 454 C 334 454 338 454 360 454"/>
  <path class="lineGreen" d="M 612 454 C 636 454 640 454 662 454"/>
  <path class="lineBlue" d="M 612 578 C 636 578 640 330 662 330"/>
  <path class="lineBlue" d="M 914 330 C 938 330 942 330 964 330"/>
  <path class="lineGreen" d="M 914 454 C 938 454 942 454 964 454"/>
  <path class="lineGold" d="M 914 588 C 938 588 942 588 964 588"/>

  <path class="lineBlue" d="M 195 378 C 195 396 195 402 195 406"/>
  <path class="lineBlue" d="M 497 378 C 497 396 497 402 497 406"/>
  <path class="lineBlue" d="M 799 378 C 799 396 799 402 799 406"/>
  <path class="lineGold" d="M 799 522 C 799 544 799 562 799 580"/>
  <path class="loop" d="M 896 504 C 926 452 914 408 892 388"/>
  <path class="lineGreen" d="M 1073 378 C 1073 396 1073 402 1073 406"/>
  <path class="lineGreen" d="M 1073 502 C 1073 520 1073 526 1073 530"/>

  <g transform="translate(58 838)">
    <rect class="chip" x="0" y="0" width="252" height="52" rx="24"/>
    <text x="20" y="21" class="tiny">Privacy boundary</text>
    <text x="20" y="39" class="small">Private profile files stay local.</text>
  </g>
  <g transform="translate(332 838)">
    <rect class="chip" x="0" y="0" width="266" height="52" rx="24"/>
    <text x="20" y="21" class="tiny blueText">Cost control</text>
    <text x="20" y="39" class="small">Planner and artifact models can differ.</text>
  </g>
  <g transform="translate(620 838)">
    <rect class="repairCard" x="0" y="0" width="286" height="52" rx="24"/>
    <text x="20" y="21" class="tiny goldText">ATS guardrail</text>
    <text x="20" y="39" class="small">No source evidence means no repair.</text>
  </g>
  <g transform="translate(928 838)">
    <rect class="chip" x="0" y="0" width="294" height="52" rx="24"/>
    <text x="20" y="21" class="tiny accentText">Human-in-the-loop</text>
    <text x="20" y="39" class="small">The workflow prepares, never submits.</text>
  </g>
</svg>
