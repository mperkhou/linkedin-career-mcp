<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">Section-aware resume and cover-letter generation with ATS repair</title>
  <desc id="desc">Diagram showing static and generated resume and cover-letter sections, initial prompts using source resume, CJD, SCJDiR, and JOD, then an ATS repair loop that uses the current draft, JOD gaps, and source-resume evidence snippets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.54" stop-color="#0b2132"/>
      <stop offset="1" stop-color="#071c1a"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#edf4f8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15354a"/>
      <stop offset="1" stop-color="#10283a"/>
    </linearGradient>
    <linearGradient id="repair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2414"/>
      <stop offset="1" stop-color="#142f2d"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d9ba"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; fill: #ffffff; letter-spacing: 0; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 500; fill: #b8c7d6; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 750; fill: #8fa8ba; letter-spacing: 1px; text-transform: uppercase; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; fill: #f2f8ff; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 560; fill: #bbcad7; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 10.5px; font-weight: 560; fill: #a9bac8; }
      .docTitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; }
      .docText { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 520; fill: #1e293b; }
      .docMuted { font-family: Arial, Helvetica, sans-serif; font-size: 9.5px; font-weight: 520; fill: #64748b; }
      .blueText { fill: #38bdf8; }
      .greenText { fill: #68e7c9; }
      .goldText { fill: #fbbf24; }
      .panel { fill: url(#panel); stroke: #ffffff; stroke-opacity: 0.14; stroke-width: 1; filter: url(#shadow); }
      .promptPanel { fill: url(#prompt); stroke: #38bdf8; stroke-opacity: 0.38; stroke-width: 1.2; filter: url(#shadow); }
      .repairPanel { fill: url(#repair); stroke: #fbbf24; stroke-opacity: 0.52; stroke-width: 1.4; filter: url(#shadow); }
      .paper { fill: url(#paper); stroke: #cbd5e1; stroke-width: 1; filter: url(#shadow); }
      .staticBox { fill: #fff1f2; stroke: #ef4444; stroke-width: 2.1; }
      .dynamicBox { fill: #effaff; stroke: #18bdf7; stroke-width: 2.3; }
      .repairBox { fill: #fff8e1; stroke: #f59e0b; stroke-width: 2.1; }
      .chip { fill: #ffffff; fill-opacity: 0.08; stroke: #ffffff; stroke-opacity: 0.14; }
      .inputChip { fill: #173348; stroke: #57d9ba; stroke-opacity: 0.45; }
      .modelChip { fill: #102a3e; stroke: #38bdf8; stroke-opacity: 0.48; }
      .staticChip { fill: #2d1119; stroke: #ef4444; stroke-opacity: 0.72; }
      .dynamicChip { fill: #0d2a3f; stroke: #38bdf8; stroke-opacity: 0.72; }
      .repairChip { fill: #2b2111; stroke: #fbbf24; stroke-opacity: 0.78; }
      .arrowBlue { fill: none; stroke: #38bdf8; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #57d9ba; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .arrowGold { fill: none; stroke: #fbbf24; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .loop { fill: none; stroke: #fbbf24; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 6; marker-end: url(#arrowGold); }
    </style>
  </defs>

  <rect width="1280" height="920" rx="32" fill="url(#bg)"/>
  <rect width="1280" height="920" rx="32" fill="url(#grid)"/>

  <text x="58" y="70" class="title">Section-Aware Template Generation</text>
  <text x="58" y="100" class="subtitle">Initial prompts build the draft. ATS repair is a second, evidence-gated loop that only keeps factual improvements.</text>

  <g transform="translate(874 48)">
    <rect class="chip" x="0" y="0" width="330" height="46" rx="23"/>
    <text x="18" y="18" class="tiny">Legend</text>
    <rect class="staticChip" x="84" y="13" width="18" height="18" rx="4"/>
    <text x="109" y="27" class="small">Static</text>
    <rect class="dynamicChip" x="160" y="13" width="18" height="18" rx="4"/>
    <text x="185" y="27" class="small">Generated</text>
    <rect class="repairChip" x="246" y="13" width="18" height="18" rx="4"/>
    <text x="272" y="27" class="small">Repair</text>
  </g>

  <g transform="translate(58 128)">
    <rect class="paper" x="0" y="0" width="438" height="716" rx="16"/>
    <text x="28" y="38" class="tiny">Template contract</text>
    <text x="28" y="64" class="docTitle">Resume and cover-letter surfaces</text>
    <text x="28" y="83" class="docMuted">Stable structure with narrow generated insertion points.</text>

    <rect class="staticBox" x="24" y="112" width="390" height="70" rx="8"/>
    <text x="42" y="137" class="docTitle">Static foundation</text>
    <text x="42" y="158" class="docText">Header, contact, summary, education, date,</text>
    <text x="42" y="174" class="docText">project paragraph, closing, and links.</text>

    <rect class="dynamicBox" x="24" y="204" width="390" height="88" rx="20"/>
    <text x="42" y="229" class="docTitle">Generated resume sections</text>
    <text x="42" y="250" class="docText">SCJDiR, Core Technical Skills, and prior</text>
    <text x="42" y="266" class="docText">experience emphasis are tailored per JOD.</text>
    <text x="42" y="282" class="docMuted">Rendered locally into the first resume PDF.</text>

    <rect class="dynamicBox" x="24" y="314" width="390" height="88" rx="20"/>
    <text x="42" y="339" class="docTitle">Generated cover-letter sections</text>
    <text x="42" y="360" class="docText">Opening fit, Oracle alignment, and prior</text>
    <text x="42" y="376" class="docText">experience alignment are prompted per job.</text>
    <text x="42" y="392" class="docMuted">Stored after render; no ATS repair pass.</text>

    <rect class="repairBox" x="24" y="424" width="390" height="104" rx="12"/>
    <text x="42" y="449" class="docTitle">Resume-only ATS repair</text>
    <text x="42" y="470" class="docText">The first resume PDF is scored against the JOD.</text>
    <text x="42" y="486" class="docText">Missing terms are checked against the source</text>
    <text x="42" y="502" class="docText">resume before any repair prompt can run.</text>
    <text x="42" y="518" class="docMuted">Goal: 90+ when evidence supports it.</text>

    <rect class="staticBox" x="24" y="550" width="390" height="70" rx="8"/>
    <text x="42" y="575" class="docTitle">Guardrails</text>
    <text x="42" y="596" class="docText">No invented tools, employers, dates, metrics,</text>
    <text x="42" y="612" class="docText">certifications, or responsibilities.</text>

    <rect class="dynamicBox" x="24" y="642" width="390" height="50" rx="16"/>
    <text x="42" y="672" class="docTitle">Final PDFs + tracker row</text>
  </g>

  <path class="arrowBlue" d="M 496 250 C 522 250 526 244 550 244"/>
  <path class="arrowBlue" d="M 496 358 C 522 358 526 360 550 360"/>
  <path class="arrowGold" d="M 496 476 C 522 476 526 548 550 548"/>

  <g transform="translate(540 128)">
    <rect class="promptPanel" x="0" y="0" width="684" height="716" rx="24"/>
    <text x="30" y="42" class="tiny">Prompt and repair pipeline</text>
    <text x="30" y="70" class="label">Two model paths: draft generation first, ATS repair only when evidence exists</text>
    <text x="30" y="94" class="small">The CJD helps shape the first draft. The repair prompt stays compact and excludes the full CJD.</text>

    <g transform="translate(30 124)">
      <rect class="inputChip" x="0" y="0" width="136" height="66" rx="14"/>
      <text x="16" y="25" class="label">Source</text>
      <text x="16" y="45" class="small">expanded resume</text>
      <text x="16" y="60" class="micro">facts + skills</text>
    </g>
    <g transform="translate(178 124)">
      <rect class="inputChip" x="0" y="0" width="136" height="66" rx="14"/>
      <text x="16" y="25" class="label">CJD</text>
      <text x="16" y="45" class="small">current role</text>
      <text x="16" y="60" class="micro">abstract context</text>
    </g>
    <g transform="translate(326 124)">
      <rect class="inputChip" x="0" y="0" width="136" height="66" rx="14"/>
      <text x="16" y="25" class="label">SCJDiR</text>
      <text x="16" y="45" class="small">current-role</text>
      <text x="16" y="60" class="micro">resume block</text>
    </g>
    <g transform="translate(474 124)">
      <rect class="inputChip" x="0" y="0" width="150" height="66" rx="14"/>
      <text x="16" y="25" class="label">JOD</text>
      <text x="16" y="45" class="small">cleaned job</text>
      <text x="16" y="60" class="micro">opening description</text>
    </g>

    <path class="arrowGreen" d="M 96 190 C 116 214 142 232 178 248"/>
    <path class="arrowGreen" d="M 246 190 C 246 214 246 228 246 248"/>
    <path class="arrowGreen" d="M 394 190 C 372 214 336 232 286 248"/>
    <path class="arrowGreen" d="M 548 190 C 514 214 436 236 310 248"/>

    <g transform="translate(30 248)">
      <rect class="panel" x="0" y="0" width="296" height="124" rx="18"/>
      <text x="22" y="32" class="label">Initial prompt builder</text>
      <text x="22" y="58" class="small">1. Pick target section</text>
      <text x="22" y="79" class="small">2. Attach source resume + CJD + JOD</text>
      <text x="22" y="100" class="small">3. Ask for section-bounded output</text>
    </g>

    <path class="arrowBlue" d="M 326 310 C 352 310 362 310 386 310"/>

    <g transform="translate(386 248)">
      <rect class="modelChip" x="0" y="0" width="238" height="124" rx="18"/>
      <text x="22" y="32" class="label">Artifact model call</text>
      <text x="22" y="58" class="small">Qwen / DeepSeek / selected model</text>
      <text x="22" y="79" class="small">Returns JSON for blue sections</text>
      <text x="22" y="100" class="tiny blueText">cost-aware</text>
    </g>

    <path class="arrowBlue" d="M 505 372 C 505 390 490 398 468 408"/>

    <g transform="translate(214 408)">
      <rect class="panel" x="0" y="0" width="256" height="86" rx="18"/>
      <text x="22" y="32" class="label">Render first artifacts</text>
      <text x="22" y="57" class="small">Resume PDF enters ATS loop</text>
      <text x="22" y="74" class="small">Cover letter stores after render</text>
    </g>

    <path class="arrowGold" d="M 342 494 C 342 512 342 522 342 536"/>

    <g transform="translate(30 536)">
      <rect class="repairPanel" x="0" y="0" width="624" height="146" rx="20"/>
      <text x="24" y="34" class="tiny goldText">ATS repair loop</text>
      <text x="24" y="58" class="label">Score PDF, gather factual evidence, repair only supported gaps</text>

      <g transform="translate(24 78)">
        <rect class="repairChip" x="0" y="0" width="132" height="48" rx="12"/>
        <text x="14" y="20" class="small">ATS proxy score</text>
        <text x="14" y="37" class="micro">JOD vs resume PDF</text>
      </g>
      <g transform="translate(172 78)">
        <rect class="repairChip" x="0" y="0" width="150" height="48" rx="12"/>
        <text x="14" y="20" class="small">Evidence gate</text>
        <text x="14" y="37" class="micro">source snippets only</text>
      </g>
      <g transform="translate(338 78)">
        <rect class="repairChip" x="0" y="0" width="140" height="48" rx="12"/>
        <text x="14" y="20" class="small">Repair prompt</text>
        <text x="14" y="37" class="micro">JOD + draft + gaps</text>
      </g>
      <g transform="translate(494 78)">
        <rect class="repairChip" x="0" y="0" width="106" height="48" rx="12"/>
        <text x="14" y="20" class="small">Rescore</text>
        <text x="14" y="37" class="micro">keep best</text>
      </g>

      <path class="arrowGold" d="M 156 102 C 164 102 166 102 172 102"/>
      <path class="arrowGold" d="M 322 102 C 330 102 332 102 338 102"/>
      <path class="arrowGold" d="M 478 102 C 486 102 488 102 494 102"/>
      <text x="24" y="136" class="micro">Up to 2 repair attempts. If no source evidence exists, the draft is stored unchanged. Target: 90+ when factual.</text>
    </g>
  </g>

  <g transform="translate(58 864)">
    <rect class="chip" x="0" y="0" width="520" height="42" rx="21"/>
    <text x="20" y="17" class="tiny">Initial generation</text>
    <text x="20" y="31" class="small">Source resume + CJD + SCJDiR + cleaned JOD shape the first draft.</text>
  </g>
  <g transform="translate(604 864)">
    <rect class="repairChip" x="0" y="0" width="620" height="42" rx="21"/>
    <text x="20" y="17" class="tiny goldText">ATS repair</text>
    <text x="20" y="31" class="small">Repair uses current draft + JOD gaps + source evidence; full CJD is intentionally omitted.</text>
  </g>
</svg>
