<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">ARO application workflow</title>
  <desc id="desc">Search planning, LinkedIn retrieval, JOD trimming, ARO creation, skill matching, bullet selection, database storage, rendering, and editing workflow.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 2; rx: 10; }
      .ai { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
      .local { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; rx: 10; }
      .db { fill: #fffbeb; stroke: #b45309; stroke-width: 2; rx: 10; }
      .title { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .laneTitle { font: 700 16px Arial, sans-serif; fill: #334155; }
      .text { font: 14px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #0f766e; stroke-width: 3; marker-end: url(#arrow); fill: none; }
      .feedback { stroke: #b45309; stroke-width: 3; marker-end: url(#amberArrow); fill: none; stroke-dasharray: 8 6; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1280" height="560" />
  <text class="title" x="34" y="42">Database-Backed ARO Workflow</text>
  <text class="text" x="34" y="68">The per-job resume is now an object transformation pipeline. The database stores the object, rendered HTML, PDF, ATS fields, and user edits.</text>

  <rect class="lane" x="30" y="98" width="1220" height="142" />
  <text class="laneTitle" x="54" y="128">Discovery And JOD Preparation</text>
  <rect class="ai" x="54" y="150" width="170" height="58" />
  <text class="text" x="72" y="174">LLM search terms</text>
  <text class="small" x="72" y="194">OpenRouter planner</text>
  <path class="arrow" d="M 226 179 L 276 179" />
  <rect class="box" x="290" y="150" width="145" height="58" />
  <text class="text" x="312" y="174">LinkedIn</text>
  <text class="small" x="312" y="194">public search/results</text>
  <path class="arrow" d="M 438 179 L 488 179" />
  <rect class="box" x="502" y="150" width="160" height="58" />
  <text class="text" x="522" y="174">Fetch details</text>
  <text class="small" x="522" y="194">raw posting text</text>
  <path class="arrow" d="M 665 179 L 715 179" />
  <rect class="local" x="730" y="150" width="220" height="58" />
  <text class="text" x="750" y="174">ML multi-pass JOD trim</text>
  <text class="small" x="750" y="194">JOD = Job Opening Description</text>
  <path class="arrow" d="M 953 179 L 1003 179" />
  <rect class="db" x="1018" y="150" width="190" height="58" />
  <text class="text" x="1038" y="174">Seed database row</text>
  <text class="small" x="1038" y="194">raw + prompt JOD</text>

  <rect class="lane" x="30" y="260" width="1220" height="178" />
  <text class="laneTitle" x="54" y="290">ARO Creation And First Draft Rendering</text>
  <rect class="box" x="54" y="315" width="170" height="74" />
  <text class="text" x="72" y="340">Clone MASTER-</text>
  <text class="text" x="72" y="360">RESUME.yml</text>
  <text class="small" x="72" y="378">Creates ARO</text>
  <path class="arrow" d="M 226 352 L 276 352" />
  <rect class="ai" x="290" y="315" width="210" height="74" />
  <text class="text" x="310" y="340">Core skills match</text>
  <text class="small" x="310" y="360">LLM sees compact</text>
  <text class="small" x="310" y="377">skills + trimmed JOD</text>
  <path class="arrow" d="M 502 352 L 552 352" />
  <rect class="local" x="566" y="315" width="210" height="74" />
  <text class="text" x="586" y="340">Score bullets locally</text>
  <text class="small" x="586" y="360">matched skills -> counts</text>
  <text class="small" x="586" y="377">per job and bullet</text>
  <path class="arrow" d="M 778 352 L 828 352" />
  <rect class="local" x="842" y="315" width="190" height="74" />
  <text class="text" x="862" y="340">Select render flags</text>
  <text class="small" x="862" y="360">min/max bullet limits</text>
  <text class="small" x="862" y="377">tie buckets preserved</text>
  <path class="arrow" d="M 1035 352 L 1085 352" />
  <rect class="db" x="1100" y="315" width="120" height="74" />
  <text class="text" x="1118" y="340">Store ARO</text>
  <text class="small" x="1118" y="360">YAML + timestamps</text>

  <rect class="lane" x="30" y="458" width="1220" height="78" />
  <text class="laneTitle" x="54" y="488">Review, Edit, Render, Score</text>
  <rect class="db" x="290" y="476" width="165" height="42" />
  <text class="text" x="308" y="502">Jinja2 HTML render</text>
  <path class="arrow" d="M 458 497 L 505 497" />
  <rect class="db" x="520" y="476" width="145" height="42" />
  <text class="text" x="538" y="502">PDF + ATS score</text>
  <path class="arrow" d="M 668 497 L 715 497" />
  <rect class="box" x="730" y="476" width="190" height="42" />
  <text class="text" x="748" y="502">Flask view/edit/download</text>
  <path class="feedback" d="M 825 474 C 900 420 1010 405 1120 390" />
  <text class="small" x="935" y="456">User edits update the ARO, then re-render/rescore</text>
</svg>
